name: Test platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements/dev.lock}
      - run: pip install --require-hashes -r requirements/dev.lock
      - run: pip check
      - run: ruff check src tests dashboard dags scripts
      - run: ruff format --check src tests dashboard dags scripts
      - run: pytest -m 'not postgres' --junitxml=artifacts/unit.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with: {name: unit-evidence, path: artifacts/}
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_USER: aircraft, POSTGRES_PASSWORD: test-only, POSTGRES_DB: aircraft_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aircraft -d aircraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: aircraft
      PGPASSWORD: test-only
      PGDATABASE: aircraft_test
      TEST_POSTGRES: '1'
      PYTHONPATH: src
      DATA_ROOT: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements/dev.lock}
      - run: pip install --require-hashes -r requirements/dev.lock
      # Native COPY remains the default; no compatibility override.
      - run: pytest -m postgres --junitxml=artifacts/postgres.xml
      - name: Create separate demo database
        run: |
          python - <<'PYCODE'
          import psycopg
          with psycopg.connect(autocommit=True) as con:
              con.execute('CREATE DATABASE aircraft_demo')
          PYCODE
      - run: python scripts/verify_demo.py
        env: {PGDATABASE: aircraft_demo}
      - run: python scripts/check_dashboard.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/
            runtime/demo/jobs/*/dbt-*.log
            runtime/demo/jobs/*/dbt-*-results.json
  airflow-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: '3.12'}
      - run: pip install apache-airflow==3.3.2 --constraint requirements/airflow-constraints-3.3.2-python3.12.txt
      - run: python scripts/check_dag.py
      - shell: pwsh
        run: ./scripts/setup.ps1 -Profile full
      - shell: pwsh
        run: ./scripts/validate-local.ps1 -Full
      - if: always()
        run: |
          mkdir -p artifacts
          docker compose --profile full ps -a > artifacts/compose-ps.txt
          docker compose --profile full logs --no-color > artifacts/compose.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with: {name: compose-evidence, path: artifacts/}
      - if: always()
        run: docker compose --profile full --profile tools down --volumes
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r notebooks/legacy/source/requirements.txt
      - run: pytest -q --junitxml=../../../artifacts/legacy.xml
        working-directory: notebooks/legacy/source
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with: {name: legacy-evidence, path: artifacts/}
