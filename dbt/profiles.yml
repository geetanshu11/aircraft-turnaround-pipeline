aircraft_turnaround:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'aircraft') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      dbname: "{{ env_var('PGDATABASE', 'aircraft_demo') }}"
      schema: analytics
      threads: 2
      connect_timeout: 10
      retries: 1
      keepalives_idle: 30
      sslmode: "{{ env_var('PGSSLMODE', 'prefer') }}"
