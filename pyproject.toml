[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "aircraft-turnaround-platform"
version = "2.0.0"
description = "Auditable BTS ingestion, PostgreSQL/dbt analytics and inferred aircraft connections"
requires-python = ">=3.12,<3.13"
[project.scripts]
aircraft = "turnaround.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated disposable PostgreSQL database", "integration: full workflow with dbt"]
[tool.ruff]
line-length = 120
exclude = ["notebooks", "runtime", "dbt/target"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
